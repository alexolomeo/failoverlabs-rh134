# vars/main.yml
validator_start_file:
  - /home/student/my_first_cron_job.txt

validator_history:
  - { id: 1, label: "Get date now", regex: '^date' , weight: 5}
  - { id: 2, label: "Add cron task - cron -e", regex: "^cron -e" , weight: 10}
  - { id: 3, label: "List all cron task - cron -l", regex: "^cron -l" , weight: 10}
  - { id: 4, label: "Waiting", regex: "^while ! test -f my_first_cron_job.txt; do sleep 1s; done" , weight: 10}
  - { id: 5, label: "Print my_first_cron_job.txt files", regex: "^cat my_first_cron_job.txt" , weight: 5}
  - { id: 6, label: "Remove all cron task", regex: "^cron -r" , weight: 15}
  - { id: 7, label: "List all cron task - cron -l", regex: "^cron -l" , weight: 10}
validator_cron:
  - { id: "8", label: "Get cron value to validate" , regex: "^*/2 * * * .*-.* /usr/bin/date >> /home/student/my_first_cron_job.txt" ,weight: 25}
validator_file:
  - { id: "9", label: "Check File my_first_cron_job.txt" , regex: "/home/student/my_first_cron_job.txt" ,weight: 10}



