---

- name: "FINISH LAB - Eliminar archivo de history del bash  {{ ansible_env.HOME }}/.bash_history, using shell: {{ ansible_env.SHELL }} "
  become: yes
  ansible.builtin.file:
    path: "root/.bash_history"
    state: absent  
  ignore_errors: yes

- name: FINISH LAB - Limpiar el historial de bash
  become: yes
  ansible.builtin.shell: "history -c "
  ignore_errors: yes

- name: Gather facts
  ansible.builtin.setup:

- name: FINISH LAB - Crear cabecera del reporte
  copy:
    dest: "{{ failover_remote_os_report }}"
    content: |
      =====================================
      Radiografía del servidor: {{ failover_remote_environment }}
      =====================================

- name: FINISH LAB - Información del sistema operativo
  lineinfile:
    path: "{{ failover_remote_os_report }}"
    line: "SO: {{ ansible_distribution }} {{ ansible_distribution_version }} {{ ansible_distribution_release }} ({{ ansible_architecture }})"
    insertafter: EOF

- name: FINISH LAB - Información de kernel y CPU
  lineinfile:
    path: "{{ failover_remote_os_report }}"
    line: "Kernel: {{ ansible_kernel }} | CPU: {{ ansible_processor[0] }} | vCPUs: {{ ansible_processor_vcpus }}"
    insertafter: EOF

- name: FINISH LAB - Memoria RAM
  lineinfile:
    path: "{{ failover_remote_os_report }}"
    line: "RAM Total: {{ ansible_memtotal_mb }} MB | RAM Libre: {{ ansible_memfree_mb }} MB"
    insertafter: EOF

- name: FINISH LAB - IP y interfaces de red
  lineinfile:
    path: "{{ failover_remote_os_report }}"
    line: "IP Principal: {{ ansible_default_ipv4.address }} | Interfaces: {{ ansible_interfaces | join(', ') }}"
    insertafter: EOF

- name: FINISH LAB - Espacio en disco
  shell: df -h
  register: discos

- name: FINISH LAB - Guardar disco en reporte
  lineinfile:
    path: "{{ failover_remote_os_report }}"
    line: "{{ item }}"
    insertafter: EOF
  loop: "{{ discos.stdout_lines }}"
    
- name: FINISH LAB - Puertos en escucha
  shell: ss -tulpn
  register: puertos

- name: FINISH LAB - Guardar puertos en reporte
  lineinfile:
    path: "{{ failover_remote_os_report }}"
    line: "{{ item }}"
    insertafter: EOF
  loop: "{{ puertos.stdout_lines }}"

- name: FINISH LAB - Procesos top 20 por uso de memoria
  shell: ps aux --sort=-%mem | head -20
  register: procesos

- name: FINISH LAB - Guardar procesos en reporte
  lineinfile:
    path: "{{ failover_remote_os_report }}"
    line: "{{ item }}"
    insertafter: EOF
  loop: "{{ procesos.stdout_lines }}"

- name: FINISH LAB - Mensaje final
  lineinfile:
    path: "{{ failover_remote_os_report }}"
    line: "====================================="
    insertafter: EOF

- name: "FINISH LAB - Leer contenido del history.log en servera"
  ansible.builtin.slurp:
    src: "{{ failover_remote_os_report }}"
  register: os_report_log

- name: "FINISH LAB - Crear el archivo history.log en workstation con el contenido leído"
  delegate_to: workstation
  ansible.builtin.copy:
    content: "{{ os_report_log['content'] | b64decode }}"
    dest: "{{ failover_remote_os_report }}"
    mode: '0644'

- name: FINISH LAB - Extraer la hora de inicio del archivo de log
  ansible.builtin.shell: |
    grep "Inicia el laboratorio" {{ failover_remote_rsyslog }} | tail -n 1 | awk -F'=' '{print $2}' | tr -d '")'
  register: raw_start_time
  changed_when: false

- name: FINISH LAB - Setear varriable de fecha para cargar al --since del journalctl
  set_fact:
    journal_start_time: "{{ raw_start_time.stdout }}"

- name: "FINISH LAB - Debug logs de journal_start_time {{ raw_start_time.stdout }}"
  ansible.builtin.debug:
    var: journal_start_time

- name: FINISH LAB - Exportar logs detallados del sistema y servicios (systemd journal)
  ansible.builtin.shell: >
    journalctl 
    --since="{{ journal_start_time }}" 
    --output=short-iso 
    > "{{ failover_remote_validator_audit }}/journal.log"
  changed_when: true

- name: FINISH LAB - Exportar logs específicos de Auditoría (Auditd / Security)
  ansible.builtin.shell: >
    journalctl 
    --since="{{ journal_start_time }}" _TRANSPORT=audit 
    > "{{ failover_remote_validator_audit }}/audit_security.log"
  changed_when: true
  failed_when: false # Por si auditd no está activo, que no rompa el playbook

- name: FINISH LAB - Exportar logs de Kernel, Boot y Alertas Críticas (Panic/Alert)
  ansible.builtin.shell: >
    journalctl -k
    --since="{{ journal_start_time }}"
    > "{{ failover_remote_validator_audit }}/kernel_boot.log"
  changed_when: true

- name: FINISH LAB - Export critical logs
  shell: >
    journalctl
    --since "{{ journal_start_time }}"
    -p warning
    > "{{ failover_remote_validator_audit }}/warnings.log"
  changed_when: true

- name: FINISH LAB - Security related journal
  shell: >
    journalctl
    SYSLOG_FACILITY=4
    --since "{{ journal_start_time }}"
    > "{{ failover_remote_validator_audit }}/security.log"
  changed_when: true

- name: FINISH LAB - Boot events
  shell: >
    journalctl -b
    --since "{{ journal_start_time }}"
    > "{{ failover_remote_validator_audit }}/boot.log"
  changed_when: true

- name: FINISH LAB - Failed services
  shell: >
    systemctl --failed
    > "{{ failover_remote_validator_audit }}/failed-services.log"
  changed_when: true

- name: FINISH LAB - Firewalld events
  shell: >
    journalctl -u firewalld
    --since "{{ journal_start_time }}"
    > "{{ failover_remote_validator_audit }}/firewalld.log"
  changed_when: true

- name: FINISH LAB - SSH activity
  shell: >
    journalctl -u sshd
    --since "{{ journal_start_time }}"
    > "{{ failover_remote_validator_audit }}/sshd.log"
  changed_when: true

- name: FINISH LAB - NFS activity
  shell: >
    journalctl
    -u nfs-server
    --since "{{ journal_start_time }}"
    > "{{ failover_remote_validator_audit }}/nfs.log"
  ignore_errors: true
  changed_when: true

- name: FINISH LAB - Export journal JSON
  shell: >
    journalctl
    --since "{{ journal_start_time }}"
    -o json
    > "{{ failover_remote_validator_audit }}/journal-source.json"
  changed_when: true

- name: FINISH LAB - Create tarball
  community.general.archive:
    path: "{{ failover_remote_validator_audit }}/*"
    dest: "{{ failover_remote_validator_temp }}/auditlog.tar.gz"
    format: gz

- name: FINISH LAB - Descargar el archivo comprimido a la Workstation
  ansible.builtin.fetch:
    src: "{{ failover_remote_validator_temp }}/auditlog.tar.gz"
    dest: "{{ failover_remote_validator_temp }}/auditlog.tar.gz"
    flat: yes 

- name: "FINISH LAB - Obtener ID de secuencia desde workstation"
  delegate_to: workstation
  ansible.builtin.command: cat "{{ failover_remote_workspace }}/{{ failover_remote_project }}/sequence/sequence.ini"
  register: lab_sequence_id
  changed_when: false

- name: "FINISH LAB - Establecer ID de laboratorio como fact"
  set_fact:
    lab_id: "{{ lab_sequence_id.stdout | trim }}"

- name: FINISH LAB - Copy All temporal files to historial simulate on servera
  shell: >
    cp "{{ failover_remote_validator_temp }}/*" "{{ failover_remote_workdir_simulate }}/{{ lab_id }}/"
  changed_when: true

- name: FINISH LAB - Copy All temporal files to historial simulate on workstation
  delegate_to: workstation
  shell: >
    cp "{{ failover_remote_validator_temp }}/*" "{{ failover_remote_workdir_simulate }}/{{ lab_id }}/"
  changed_when: true

- name: FINISH LAB - Extract archive locally
  delegate_to: workstation
  unarchive:
    src: "{{ failover_remote_workdir_simulate }}/{{ lab_id }}/auditlog.tar.gz"
    dest: "{{ failover_remote_workdir_simulate }}/{{ lab_id }}/"
    remote_src: false

