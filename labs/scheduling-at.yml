---

- name: scheduling at
  hosts: workstation
  gather_facts: no
  become: true
  vars: 
    failover_mode: "start"
  roles:
    - role: scheduling-at
      failover_project: scheduling-at               # lab <failover_mode> <failover_project>
      failover_environment: "workstation"               # workstation, servera serverb 
      failover_user: root 
      failover_group: root


- name: scheduling at
  hosts: servera
  gather_facts: no
  become: true
  vars: 
    failover_mode: "start"
  roles:
    - role: scheduling-at
      failover_remote_project: scheduling-at
      failover_remote_environment: "servera"              # workstation, servera serverb 
      failover_remote_user: root
      failover_remote_group: root
      validator_history:
        - { id: 1, label: "set at next 2 min, generate myjob.txt file", regex: '^ *[0-9]\+  echo .*date >> /home/student/myjob.txt.* | at now \+[0-9]min' , weight: 10}
        - { id: 2, label: "Query all jobs - atq", regex: "^atq" , weight: 10}
        - { id: 3, label: "Waching scheduling - watch atq", regex: "^watch atq" , weight: 10}
        - { id: 4, label: "Print myjob.txt files", regex: "^cat myjob.txt" , weight: 5}
        - { id: 5, label: "Schedule teatime jobs", regex: "^at -q g teatime" , weight: 10}
        - { id: 6, label: "Schedule cookies time jobs", regex: "^at -q b 16:05" , weight: 10}
        - { id: 7, label: "Edit command teatime jobs", regex: "^at -c 2" , weight: 10}
        - { id: 8, label: "Edit command cookies jobs", regex: "^at -c 3" , weight: 10}
        - { id: 9, label: "Remove scheduling teatime", regex: "^atrm 2" , weight: 10}
      validator_at:
        - { id: "10", label: "Get validation job b" , regex: ".*b student" ,weight: 10}
      validator_file:
        - { id: "11", label: "Check File" , regex: "/home/student/myjob.txt" ,weight: 5}

