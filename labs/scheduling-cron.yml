---

- name: scheduling at
  hosts: workstation
  gather_facts: no
  become: true
  vars: 
    failover_mode: "start"
  roles:
    - role: scheduling-cron
      failover_project: scheduling-cron               # lab <failover_mode> <failover_project>
      failover_environment: "workstation"               # workstation, servera serverb 
      failover_user: root 
      failover_group: root


- name: scheduling at
  hosts: servera
  gather_facts: no
  become: true
  vars: 
    failover_mode: "start"
  roles:
    - role: scheduling-cron
      failover_remote_project: scheduling-cron
      failover_remote_environment: "servera"              # workstation, servera serverb 
      failover_remote_user: root
      failover_remote_group: root
      validator_history:
        - { id: 1, label: "Get date now", regex: '^date' , weight: 5}
        - { id: 2, label: "Add cron task - cron -e", regex: "^crontab -e" , weight: 10}
        - { id: 3, label: "List all cron task - crontab -l", regex: "^crontab -l" , weight: 10}
        - { id: 4, label: "Waiting", regex: "^while ! test -f my_first_cron_job.txt; do sleep 1s; done" , weight: 10}
        - { id: 5, label: "Print my_first_cron_job.txt files", regex: "^cat my_first_cron_job.txt" , weight: 5}
        - { id: 6, label: "Remove all cron task", regex: "^crontab -r" , weight: 15}
        - { id: 7, label: "List all cron task - crontab -l", regex: "^crontab -l" , weight: 10}
      validator_cron:
        - { id: "8", label: "Get cron value to validate" , regex: '^\*/2\s+\*\s+\*\s+\*\s+([A-Za-z]{3}(-[A-Za-z]{3})?)\s+/usr/bin/date\s+>>\s+/home/student/my_first_cron_job\.txt$' , weight: 25}
      validator_file:
        - { id: "9", label: "Check File my_first_cron_job.txt" , regex: "/home/student/my_first_cron_job.txt" , weight: 10}

